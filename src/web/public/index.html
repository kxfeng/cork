<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cork</title>
    <!-- Inlined as a data URI rather than served as an asset: it needs no route,
         no request, and cannot 404. A prompt caret and a cursor, in the same two
         colours the page uses. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.4' fill='%231d1d22'/%3E%3Cpath d='M3.6 4.8 6.7 7.6 3.6 10.4' fill='none' stroke='%236ea8fe' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8.9 10.4h3.5' fill='none' stroke='%2392929e' stroke-width='2.1' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/xterm.css" />
    <style>
      :root {
        --bg: #16161a;
        --panel: #1d1d22;
        --line: #2c2c34;
        --fg: #d6d6dd;
        --dim: #7c7c88;
        --accent: #6ea8fe;
        --live: #46c07a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      }
      aside {
        width: 270px;
        flex: none;
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      header b { font-size: 14px; letter-spacing: 0.02em; }
      #list { overflow-y: auto; flex: 1; padding: 6px; }
      .s {
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 2px;
        /* Rows are targets, not text. Without this a right-click drags a
           selection across the name it is about to open a menu for. */
        user-select: none;
      }
      .s:hover { background: #26262d; }
      .s.on { background: #2f3b52; }
      .s .n {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4a4a55;
        flex: none;
      }
      .dot.live { background: var(--live); }
      .s .m {
        color: var(--dim);
        font-size: 11px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #bar {
        padding: 8px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--dim);
        font-size: 12px;
        display: flex;
        justify-content: space-between;
      }
      #term {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: 6px 0 0 8px;
        border-left: 2px solid transparent;
        position: relative; /* containing block for the not-running overlay */
      }
      /* Shown instead of the pane when a session has no process. Drawn in HTML
         rather than written into the terminal: monospace prose sitting alone on
         a black field reads as output that went wrong, and it would also be
         scrolled around by whatever the pane did next. */
      #offline {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      #offline[hidden] { display: none; }
      /* The whole thing is the button — a 44px glyph is a small target for the
         only action available on this screen. */
      #ostart {
        border: 0;
        background: transparent;
        font: inherit;
        color: var(--dim);
        text-align: center;
        padding: 18px 26px;
        border-radius: 10px;
        cursor: pointer;
      }
      /* Same shape and colours as the header's .ib buttons, scaled up: this is
         the same control, just where the eye is when the pane is empty. */
      #ostart .oi {
        width: 38px;
        height: 32px;
        margin: 0 auto 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.12s, border-color 0.12s, background 0.12s;
      }
      #ostart .oi svg { width: 13px; height: 13px; fill: currentColor; margin-left: 1px; }
      /* The glyph is the target; the line under it is a caption, so only the
         glyph reacts — matching .ib:hover exactly. */
      #ostart:hover .oi { color: var(--fg); border-color: #3d3d47; background: #26262d; }
      #ostart .ot { font-size: 13px; }
      #ostart:disabled { cursor: default; opacity: 0.45; }
      #ostart:disabled:hover .oi {
        color: var(--dim);
        border-color: var(--line);
        background: transparent;
      }
      /* Which side has the keyboard. xterm sets .focus on its own root. */
      #term:has(.focus) { border-left-color: var(--accent); }
      /* Only reached when WebGL is unavailable and xterm falls back to the DOM
         renderer. That renderer sizes each row element to (cols × the cell
         width it measured) and clips it, but the browser lays the same text
         out at the font's true advance, which is wider — so the last glyph of
         a full row gets shaved. Letting a row paint past its own box costs
         nothing: it overruns by ~2px and still ends well inside the terminal,
         which has ~8px to spare. `!important` because the renderer sets
         overflow inline. Inert under WebGL, which builds no row elements. */
      .xterm .xterm-rows > div { overflow: visible !important; }
      #empty {
        margin: auto;
        color: var(--dim);
      }
      #composer {
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 8px 10px;
        display: none;
        gap: 8px;
        align-items: flex-end;
      }
      #composer.on { display: flex; }
      #msg {
        flex: 1;
        resize: none;
        min-height: 38px;
        max-height: 40vh;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, "PingFang SC", monospace;
      }
      #msg:focus { outline: none; border-color: var(--accent); }
      #msg:disabled { opacity: 0.45; cursor: not-allowed; }
      #actions { display: flex; gap: 5px; align-items: center; flex: none; }
      .ib {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
      }
      .ib:hover { color: var(--fg); border-color: #3d3d47; background: #26262d; }
      .ib svg { width: 12px; height: 12px; fill: currentColor; }
      .ib.danger:hover { color: #ff7070; border-color: #5c2b2b; background: #2b1a1a; }
      /* Confirmation for destructive actions. Drawn in-page rather than using
         confirm(), which blocks the page and every event behind it. */
      #modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(8, 8, 11, 0.66);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #modal[hidden] { display: none; }
      .mbox {
        width: min(400px, calc(100vw - 40px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 18px 14px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      }
      .mbox h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
      .mbox p { margin: 0 0 16px; font-size: 12px; line-height: 1.65; color: var(--dim); }
      .mbox p b { color: var(--fg); font-weight: 600; }
      /* Info rows. A fixed label column keeps the values on one left edge; the
         values are paths, ids and shell commands, so they wrap on any character
         rather than pushing the dialog wider than the viewport. */
      dl.info {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 6px 12px;
        margin: 0 0 16px;
        font-size: 12px;
        line-height: 1.5;
      }
      /* Row context menu. Fixed rather than absolute so it is positioned in
         viewport coordinates, which is what the click event reports. */
      #menu {
        position: fixed;
        z-index: 60;
        min-width: 150px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        user-select: none;
      }
      #menu button {
        display: block;
        width: 100%;
        padding: 7px 10px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      #menu button:hover { background: #26262d; }
      #menu button.danger { color: #ff9090; }
      #menu button.danger:hover { background: #3a1f1f; }

      /* Create-dialog fields. Label above input rather than beside it: one of
         the two values is an absolute path, which needs the full width. */
      label.f { display: block; margin: 0 0 12px; }
      label.f span {
        display: block;
        margin-bottom: 5px;
        font-size: 11px;
        color: var(--dim);
      }
      label.f input {
        width: 100%;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #101014;
        color: var(--fg);
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      label.f input:focus { outline: none; border-color: #3d3d47; }
      /* Shown for context, not to be changed — see the rename dialog. */
      label.f input:disabled { color: var(--dim); background: #0d0d11; cursor: default; }
      .mbox p.hint { margin: 0 0 16px; }
      dl.info dt { color: var(--dim); }
      dl.info dd {
        margin: 0;
        color: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
      }
      .mrow { display: flex; justify-content: flex-end; gap: 8px; }
      .mrow button {
        padding: 7px 15px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .mrow button:hover { background: #26262d; }
      .mrow button.danger { border-color: #7d3838; background: #3a1f1f; color: #ff9090; }
      .mrow button.danger:hover { background: #4b2626; }
      /* An action in flight disables its own button rather than narrating
         itself in a status line below the composer. */
      .ib:disabled { opacity: 0.4; cursor: default; }
      .ib:disabled:hover { color: var(--dim); border-color: var(--line); background: transparent; }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <b>Cork</b>
        <button id="new" class="ib" type="button"
                title="New session — Claude Code here, with no chat behind it">
          <svg viewBox="0 0 16 16"><path d="M7.3 2.6h1.4v4.7h4.7v1.4H8.7v4.7H7.3V8.7H2.6V7.3h4.7V2.6z"/></svg>
        </button>
      </header>
      <div id="list"></div>
    </aside>
    <main>
      <div id="bar"><span id="who">select a session</span><span id="actions"></span></div>
      <div id="term">
        <div id="empty">no session selected</div>
        <div id="offline" hidden>
          <button id="ostart" type="button">
            <div class="oi"><svg viewBox="0 0 16 16"><path d="M5 3.2v9.6c0 .4.4.6.7.4l7.2-4.8c.3-.2.3-.6 0-.8L5.7 2.8c-.3-.2-.7 0-.7.4z"/></svg></div>
            <div class="ot">Click to start the session</div>
          </button>
        </div>
      </div>
      <div id="composer">
        <textarea id="msg" rows="1" placeholder="Write a message…"></textarea>
      </div>
    </main>

    <div id="menu" hidden></div>

    <div id="modal" hidden>
      <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
        <h3 id="mtitle"></h3>
        <p id="mtext"></p>
        <div class="mrow">
          <button id="mcancel">Cancel</button>
          <button id="mok" class="danger" hidden>Delete</button>
        </div>
      </div>
    </div>

    <script src="/assets/xterm.js"></script>
    <script src="/assets/addon-fit.js"></script>
    <script src="/assets/addon-webgl.js"></script>
    <script>
      // The server answers ?token=… with a cookie, so once this page has loaded
      // the token is redundant. Drop it from the address bar (and from the
      // bookmark the user is about to make) — the cookie carries it from now on.
      if (new URLSearchParams(location.search).has("token")) {
        history.replaceState(null, "", location.pathname);
      }
      const $ = (id) => document.getElementById(id);

      let term = null;
      let fit = null;
      let ws = null;
      let current = null;

      /**
       * Enter or leave the not-running state. The overlay stands in for the pane,
       * and the composer is greyed out with it — there is nothing to type into,
       * and letting people try was what produced the race described in send().
       *
       * The placeholder is left alone: the overlay filling the screen already
       * says the session is not running, and restating it in the composer just
       * makes the same point twice. Being greyed out is enough on its own.
       *
       * Focus is deliberately not touched either — this runs on every poll, and
       * stealing the keyboard back from the pane every few seconds would be worse
       * than the problem it solved.
       */
      function setOffline(on) {
        $("offline").hidden = !on;
        $("ostart").disabled = busy;
        $("msg").disabled = on;
      }

      // Same action as the header's start button — this one is just where the eye
      // already is when the pane is empty.
      $("ostart").onclick = () => {
        if (!busy && current) startSession(current);
      };

      $("new").onclick = () => {
        if (!busy) newSession();
      };

      function openSession(s) {
        if (ws) { ws.close(); ws = null; }
        saveDraft();
        current = s.key;
        // Restore before the pane work below, so the box is already right when
        // the socket opens and focuses it.
        $("msg").value = drafts.get(s.key) ?? "";
        sizeComposer();
        render(sessions);
        renderActions();
        $("who").textContent = `${s.chatName} · ${subtitle(s)}`;
        $("empty")?.remove();
        $("composer").classList.add("on");

        if (!term) {
          term = new Terminal({
            // Menlo & friends carry no CJK glyphs — without a CJK fallback here,
            // every Chinese character in a pane renders as a blank box.
            fontFamily:
              'ui-monospace, SFMono-Regular, Menlo, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace',
            fontSize: 13,
            // A trackpad emits a stream of small wheel events — a few px of
            // deltaY each — and xterm quietly scales anything under 50px down
            // to 30% of its travel. A slow two-finger drag therefore moves the
            // pane a fifth as far as the same distance flicked quickly, and far
            // less than the native terminal, which applies no such damping.
            // This multiplier is applied before the damping, so it cancels it.
            // A mouse wheel reports 100+ per notch and is never damped, so it
            // does get faster here; trackpads are what this view is driven by.
            scrollSensitivity: 3,
            cursorBlink: true,
            theme: { background: "#16161a", foreground: "#d6d6dd" },
          });
          fit = new FitAddon.FitAddon();
          term.loadAddon(fit);
          term.open($("term"));
          // The DOM renderer hands a whole row to the browser to lay out, and
          // the browser's own advance widths do not add up to what xterm sized
          // the row for — a 147-column line comes out ~2px too wide and the
          // row's overflow:hidden shaves the last glyph. WebGL draws each cell
          // into the grid itself, so a row cannot end up wider than its box.
          // Must come after open(): the addon needs the screen element.
          try {
            const webgl = new WebglAddon.WebglAddon();
            // A lost context leaves the canvas blank with no way back, so drop
            // the addon and let xterm fall back to the DOM renderer.
            webgl.onContextLoss(() => webgl.dispose());
            term.loadAddon(webgl);
          } catch {
            // No WebGL here (blocklisted GPU, headless without swiftshader).
            // The DOM renderer stays — worse glyph clipping, still usable.
          }
          term.onData((d) => {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({ type: "input", data: d }));
            }
          });
          boxWatcher.observe($("term"));
        }
        term.reset();

        // Nothing to attach to, and nothing to type into: bringing the pane up is
        // the only thing that can be done here, and the start button is how.
        // Composing was allowed at one point and it raced — the text and its
        // carriage return arrived while Claude Code was still booting (and while
        // the daemon was dismissing its startup dialog with Enters of its own),
        // so the message would land in the prompt but not be submitted.
        setOffline(!s.alive);
        if (!s.alive) return;

        const proto = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(
          `${proto}://${location.host}/ws?session=${encodeURIComponent(s.key)}`
        );
        ws.onopen = () => { sendFit(); focusComposer(); };
        ws.onmessage = (e) => term.write(e.data);
        ws.onclose = () => term.write("\r\n\x1b[90m— detached —\x1b[0m\r\n");
      }

      /**
       * Type into the pane, exactly as if the text had been typed in the terminal.
       *
       * It used to be handed to the daemon instead, which fed it in as a channel
       * message — the model then answered over the chat, and this view, which has
       * only the pane to show, missed the reply. Going through the pane keeps the
       * whole exchange where it is being read.
       *
       * The cost is that the chat no longer sees this side of the conversation.
       * That is the point: a message typed here is addressed to the pane, not to
       * the group.
       */
      function send() {
        const text = $("msg").value;
        if (!text.trim() || !current) return;
        // The composer is disabled whenever the pane is down, so this only has to
        // guard against a socket that dropped between keystroke and send. It used
        // to start the session first, which raced: the text and its carriage
        // return could arrive while Claude Code was still booting — and while the
        // daemon was dismissing the startup dialog with Enters of its own — so the
        // message landed in the prompt without being submitted.
        if (!ws || ws.readyState !== 1) {
          console.error("send: no socket to the pane"); // text stays in the composer
          return;
        }

        // Sent as-is, then a carriage return to submit. Newlines inside the text
        // stay newlines: a terminal app reads Enter as CR, so LF passes through as
        // a line break rather than submitting the message early. (Bracketed paste
        // would be the tidier way to say "this is one block", but Claude Code does
        // not turn it on — the markers would arrive as literal characters.)
        ws.send(JSON.stringify({ type: "input", data: text }));
        ws.send(JSON.stringify({ type: "input", data: "\r" }));
        $("msg").value = "";
        drafts.delete(current); // it went to the pane; it is not a draft any more
        sizeComposer();
        $("msg").focus(); // stay in the composer; the pane takes focus only on click
      }

      $("msg").addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || e.isComposing) return; // IME mid-composition
        if (e.shiftKey) return; // Shift+Enter: newline, the default
        e.preventDefault();
        send();
      });
      $("msg").addEventListener("input", sizeComposer);

      // Esc is not intercepted here. It used to hand the keyboard back to the
      // composer, but Escape belongs to the TUI: Claude Code closes /status and
      // its permission prompts with it, and a dialog that cannot be dismissed is
      // worse than needing a click to move focus. Clicking either box switches
      // focus, and xterm only reads the keyboard while it is focused, so the two
      // never fight over it.

      /**
       * Half-written messages, per session.
       *
       * There is one composer for every session, so without this a draft
       * followed the eye from one session to the next and could be sent into
       * the wrong pane. Kept in memory only: a reload starts clean, which is
       * what a reload is for.
       */
      const drafts = new Map();

      /**
       * Focus the composer with the caret after whatever is already in it.
       * Focusing a textarea whose value was set while it was unfocused puts the
       * caret at position 0, so returning to a session with a draft would drop
       * you in front of your own sentence.
       */
      function focusComposer() {
        const t = $("msg");
        t.focus();
        t.setSelectionRange(t.value.length, t.value.length);
      }

      function saveDraft() {
        if (!current) return;
        const text = $("msg").value;
        if (text) drafts.set(current, text);
        else drafts.delete(current);
      }

      function sizeComposer() {
        const t = $("msg");
        t.style.height = "auto";
        t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.4) + "px";
        // #term shrinks as the composer grows; boxWatcher picks that up and re-fits.
      }

      // tmux sizes the pane to its client, so the pane must track the browser.
      //
      // FitAddon derives the column count from the measured width of one cell. If
      // it measures before the font is ready the cell comes out too narrow, it asks
      // for more columns than actually fit, and once the real font lands every line
      // overflows the container and gets clipped on the right. So: never fit until
      // document.fonts is settled, and re-fit whenever the box itself changes size
      // (a window resize is only one of the ways that happens — the composer
      // growing is another).
      let fontsReady = false;
      document.fonts.ready.then(() => {
        fontsReady = true;
        sendFit();
      });

      function sendFit() {
        if (!fit || !term || !fontsReady) return;
        fit.fit();
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
        }
      }

      const boxWatcher = new ResizeObserver(() => sendFit());

      let sessions = [];
      let defaultWorkspace = ""; // prefill for the create dialog; comes with the list
      let busy = false; // an action is in flight; its button shows it, nothing else does

      /**
       * The one in-page dialog, drawn rather than handed to confirm() — which
       * blocks the page and every event behind it, and cannot name the session
       * it is asking about.
       *
       * `ok` labels the accepting button, or is null for a dialog that only has
       * something to say: then Cancel becomes Close and Enter dismisses it, so
       * the keyboard behaves the way the single button reads. Always resolves —
       * false on Cancel, Esc, or a click on the backdrop.
       */
      function dialog({ title, html, ok = null, danger = false, focus = null }) {
        return new Promise((resolve) => {
          const m = $("modal");
          $("mtitle").textContent = title;
          $("mtext").innerHTML = html;
          $("mok").hidden = !ok;
          if (ok) $("mok").textContent = ok;
          $("mok").className = danger ? "danger" : "";
          $("mcancel").textContent = ok ? "Cancel" : "Close";
          m.hidden = false;
          (focus ? $(focus) : ok ? $("mok") : $("mcancel")).focus();
          const onKey = (e) => {
            if (e.key === "Escape") { e.stopPropagation(); done(false); }
            else if (e.key === "Enter") { e.stopPropagation(); done(!!ok); }
          };
          const done = (v) => {
            m.hidden = true;
            $("mok").onclick = $("mcancel").onclick = m.onclick = null;
            document.removeEventListener("keydown", onKey, true);
            focusComposer();
            resolve(v);
          };
          $("mok").onclick = () => done(true);
          $("mcancel").onclick = () => done(false);
          m.onclick = (e) => { if (e.target === m) done(false); }; // backdrop
          document.addEventListener("keydown", onKey, true);
        });
      }

      // A local session has no chat to reassure anyone about — promising one is
      // untouched would imply a group exists somewhere that does not.
      const confirmDelete = (name, local) =>
        dialog({
          title: "Delete this session?",
          html:
            `<b>${escapeHtml(name)}</b> — stops Claude Code and drops Cork's ` +
            `record of it. ` +
            (local
              ? `Claude's own session file is untouched and stays resumable.`
              : `The chat itself is untouched, and so is Claude's own session ` +
                `file, which stays resumable.`),
          ok: "Delete",
          danger: true,
        });

      /**
       * Open a Claude Code session with no chat behind it. Named and pointed at
       * a workspace here, because those are the only two things cork cannot
       * infer — everything else about it matches a chat session.
       */
      async function newSession() {
        const ws = escapeHtml(defaultWorkspace);
        const goahead = await dialog({
          title: "New session",
          html:
            `<label class="f"><span>Name</span>` +
            `<input id="fname" type="text" placeholder="optional" autocomplete="off"></label>` +
            `<label class="f"><span>Workspace</span>` +
            `<input id="fws" type="text" value="${ws}" spellcheck="false" autocomplete="off"></label>` +
            `<p class="hint">Claude Code runs here with no channel and no Stop hook — ` +
            `it talks to you in this terminal only.</p>`,
          ok: "Create",
          focus: "fname",
        });
        if (!goahead) return;
        const name = $("fname")?.value || "";
        const workspace = $("fws")?.value || "";
        busy = true;
        renderActions();
        try {
          const r = await fetch("/api/session/create", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name, workspace }),
          });
          if (!r.ok) throw new Error(await r.text());
          const { key } = await r.json();
          await refresh();
          const s = sessions.find((x) => x.key === key);
          if (s) openSession(s);
        } catch (err) {
          console.error("create:", err);
          await dialog({
            title: "Could not create the session",
            html: escapeHtml(String(err)),
          });
        } finally {
          busy = false;
          renderActions();
        }
      }

      /** The same fields `/status` reports in a chat, read live when opened. */
      async function showInfo(key) {
        let s;
        try {
          const r = await fetch(`/api/session/status?session=${encodeURIComponent(key)}`);
          if (!r.ok) throw new Error(`status ${r.status}`);
          s = await r.json();
        } catch (err) {
          console.error("info:", err);
          await dialog({
            title: "Session info",
            html: `Could not read this session's status — ${escapeHtml(String(err))}.`,
          });
          return;
        }
        // The same fields, in the same order, as the `/status` reply in a chat.
        // Whether it is running is not among them: the list dot and the
        // start/stop button in the header both say so already.
        const rows = [
          ["Name", s.chatName],
          s.channel === "local" ? null : ["Channel", s.channel + (s.isThread ? " (thread)" : "")],
          s.chatType === "group" ? ["Mention", s.mentionRequired ? "on" : "off"] : null,
          ["Workspace", s.workspace],
          ["Cork session", s.key],
          ["Claude session", s.sessionId],
          ["Claude context", s.claudeContext],
          ["Terminal", s.terminal],
        ].filter(Boolean);
        await dialog({
          title: "Session info",
          html:
            '<dl class="info">' +
            rows
              .map(
                ([k, v]) =>
                  `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(String(v ?? ""))}</dd>`
              )
              .join("") +
            "</dl>",
        });
      }

      const ICON = {
        start: '<svg viewBox="0 0 16 16"><path d="M5 3.2v9.6c0 .4.4.6.7.4l7.2-4.8c.3-.2.3-.6 0-.8L5.7 2.8c-.3-.2-.7 0-.7.4z"/></svg>',
        stop: '<svg viewBox="0 0 16 16"><rect x="4.3" y="4.3" width="7.4" height="7.4" rx="1.2"/></svg>',
        trash: '<svg viewBox="0 0 16 16"><path d="M6.3 1.6h3.4c.4 0 .7.3.7.7v.8h2.7c.4 0 .7.3.7.6s-.3.6-.7.6h-.6l-.6 8.3c0 .8-.7 1.4-1.5 1.4H5.6c-.8 0-1.4-.6-1.5-1.4l-.6-8.3H2.9c-.4 0-.7-.3-.7-.6s.3-.6.7-.6h2.7v-.8c0-.4.3-.7.7-.7zm.7 1.5h2v-.3h-2v.3z"/></svg>',
        info: '<svg viewBox="0 0 16 16"><path d="M8 1.4a6.6 6.6 0 100 13.2A6.6 6.6 0 008 1.4zm0 1.3a5.3 5.3 0 110 10.6A5.3 5.3 0 018 2.7zm0 1.5a.9.9 0 100 1.8.9.9 0 000-1.8zM7.3 7h1.4v4.6H7.3V7z"/></svg>',
      };

      // Both buttons act on whichever session is open, so they sit in the header
      // beside its name rather than repeating on every row of the list.
      function renderActions() {
        $("ostart").disabled = busy; // shares the in-flight state with the header
        const box = $("actions");
        box.innerHTML = "";
        const s = sessions.find((x) => x.key === current);
        if (!s) return;
        const add = (title, svg, onclick, cls) => {
          const b = document.createElement("button");
          b.className = "ib" + (cls ? " " + cls : "");
          b.title = title;
          b.innerHTML = svg;
          b.onclick = onclick;
          b.disabled = busy;
          box.appendChild(b);
        };
        add("Info — what /status reports for this session", ICON.info,
          () => showInfo(s.key));
        if (s.alive) {
          add("Stop — end the Claude Code process, keep the session", ICON.stop,
            () => stopSession(s.key));
        } else {
          add("Start — bring up Claude Code, resuming this session", ICON.start,
            () => startSession(s.key));
        }
        add(
          "Delete — stop the process and drop Cork's session",
          ICON.trash,
          async () => {
            const label = s.chatName + (s.isThread ? " ⤷ thread" : "");
            if (await confirmDelete(label, s.channel === "local")) dropSession(s.key);
          },
          "danger"
        );
      }

      const act = (action, key, extra) =>
        fetch(`/api/session/${action}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ session: key, ...extra }),
        });

      /** Poll until the pane is up, so we attach only once there is something to
       *  attach to. Claude Code takes a couple of seconds to boot. */
      async function waitAlive(key, timeoutMs = 25000) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
          await new Promise((r) => setTimeout(r, 400));
          const r = await fetch("/api/sessions");
          if (!r.ok) continue;
          sessions = (await r.json()).sessions;
          if (sessions.find((s) => s.key === key)?.alive) return true;
        }
        return false;
      }

      /**
       * Run one lifecycle action with its button disabled for the duration —
       * that, and the pane appearing or going away, is the whole of the feedback.
       * Failures go to the console rather than into the page.
       */
      async function runAction(action, key, extra) {
        busy = true;
        renderActions();
        try {
          const r = await act(action, key, extra);
          if (!r.ok) {
            console.error(`${action} failed`, r.status, await r.text().catch(() => ""));
            return false;
          }
          return true;
        } catch (e) {
          console.error(`${action} failed`, e);
          return false;
        } finally {
          busy = false;
        }
      }

      async function startSession(key) {
        if (!(await runAction("start", key))) { renderActions(); return false; }
        const up = await waitAlive(key);
        render(sessions);
        renderActions();
        if (!up) {
          console.error("start: pane never came up for", key);
          return false;
        }
        if (current === key) openSession(sessions.find((s) => s.key === key));
        return true;
      }

      async function stopSession(key) {
        if (!(await runAction("stop", key))) { renderActions(); return; }
        if (ws) { ws.close(); ws = null; } // its pane is gone; don't hold the socket
        await refresh();
      }

      async function dropSession(key) {
        if (!(await runAction("delete", key))) { renderActions(); return; }
        drafts.delete(key); // nothing left to send it to
        if (current === key) {
          if (ws) { ws.close(); ws = null; }
          current = null;
          term?.reset();
          $("msg").value = "";
          sizeComposer();
          $("who").textContent = "select a session";
          $("composer").classList.remove("on");
          setOffline(false); // nothing is selected, so nothing is "not running"
        }
        await refresh();
      }

      /**
       * The second line of a list row, and the same text in the header.
       *
       * A local session names no channel. It is the one kind that has nothing
       * on the other side, so "local" would be a label for the absence of one —
       * and for anyone using cork mostly this way it would repeat down the whole
       * list saying nothing. The chat-backed kinds keep theirs, because there it
       * distinguishes two sessions that otherwise read identically.
       */
      function subtitle(s) {
        const parts = s.channel === "local" ? [] : [s.channel];
        parts.push(s.workspace);
        return parts.join(" · "); // plain text; the HTML caller escapes it
      }

      function render(list) {
        $("list").innerHTML = "";
        for (const s of list) {
          const el = document.createElement("div");
          el.className = "s" + (s.key === current ? " on" : "");
          const name = s.chatName + (s.isThread ? " ⤷ thread" : "");
          el.innerHTML =
            `<div class="n"><i class="dot${s.alive ? " live" : ""}"></i>${escapeHtml(name)}</div>` +
            `<div class="m">${escapeHtml(subtitle(s))}</div>`;
          // A stopped session opens too — dimmed, but reachable, so it can be
          // started (or dropped) from here rather than only from its chat.
          el.onclick = () => openSession(s);
          el.oncontextmenu = (e) => showMenu(e, s);
          if (!s.alive) el.style.opacity = 0.55;
          $("list").appendChild(el);
        }
      }

      /**
       * Row menu. The header's buttons act on whichever session is open; this
       * acts on the row under the cursor, so a session can be renamed or dropped
       * without opening it first.
       */
      function showMenu(e, s) {
        e.preventDefault();
        const m = $("menu");
        m.innerHTML = "";
        const add = (label, onclick, cls) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = label;
          if (cls) b.className = cls;
          b.onclick = () => { hideMenu(); onclick(); };
          m.appendChild(b);
        };
        // Only a local session can be renamed — a chat's title is the
        // platform's, and cork overwrites it on the next message either way.
        if (s.channel === "local") add("Rename", () => renameSession(s));
        add("Delete", async () => {
          const label = s.chatName + (s.isThread ? " ⤷ thread" : "");
          if (await confirmDelete(label, s.channel === "local")) dropSession(s.key);
        }, "danger");

        // Place it, then pull it back inside the viewport if it would hang off
        // the right or bottom edge — a menu you have to scroll to is no menu.
        m.hidden = false;
        m.style.left = "0px";
        m.style.top = "0px";
        const r = m.getBoundingClientRect();
        m.style.left = Math.min(e.clientX, window.innerWidth - r.width - 6) + "px";
        m.style.top = Math.min(e.clientY, window.innerHeight - r.height - 6) + "px";
      }

      function hideMenu() {
        $("menu").hidden = true;
      }

      // Anything else the user does dismisses it: a click anywhere (including
      // on the menu's own backdrop), Escape, scrolling the list, or resizing.
      document.addEventListener("mousedown", (e) => {
        if (!$("menu").hidden && !$("menu").contains(e.target)) hideMenu();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideMenu();
      });
      window.addEventListener("resize", hideMenu);
      $("list").addEventListener("scroll", hideMenu);

      /** Retitle a local session. Same dialog as create, with the workspace
       *  shown but fixed — moving a session is a different operation. */
      async function renameSession(s) {
        const goahead = await dialog({
          title: "Rename session",
          html:
            `<label class="f"><span>Name</span>` +
            `<input id="fname" type="text" maxlength="60" autocomplete="off" ` +
            `value="${escapeHtml(s.chatName)}"></label>` +
            `<label class="f"><span>Workspace</span>` +
            `<input type="text" value="${escapeHtml(s.workspace)}" disabled></label>`,
          ok: "Save",
          focus: "fname",
        });
        if (!goahead) return;
        const name = $("fname")?.value || "";
        if (!name.trim() || name.trim() === s.chatName) return;
        if (!(await runAction("rename", s.key, { name }))) { renderActions(); return; }
        await refresh();
        // The header caption is written when a session is opened, so refresh()
        // alone leaves the old title up there for the one that is on screen.
        const open = sessions.find((x) => x.key === current);
        if (open) $("who").textContent = `${open.chatName} · ${subtitle(open)}`;
      }

      const escapeHtml = (t) =>
        t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      async function refresh() {
        const r = await fetch("/api/sessions");
        if (!r.ok) {
          document.body.textContent = "unauthorized — open the URL printed by `cork status`";
          return;
        }
        const data = await r.json();
        sessions = data.sessions;
        defaultWorkspace = data.defaultWorkspace || defaultWorkspace;
        render(sessions);
        renderActions(); // a session may have come up or gone away since last poll
        // Same reason: one stopped from a terminal, or that died, has to grey the
        // composer here too — not only when it was this view that stopped it.
        const open = sessions.find((s) => s.key === current);
        if (open) setOffline(!open.alive);
      }

      refresh();
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
